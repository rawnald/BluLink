name = "blulink"
compatibility_date = "2024-09-23"

# Cloudflare D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "datalink-db"
database_id = "YOUR_CLOUDFLARE_D1_DATABASE_ID"

# Cloudflare R2 Object Storage Bucket for Project storage
[[r2_buckets]]
binding = "PROJECTS_BUCKET"
bucket_name = "blulink-projects"
